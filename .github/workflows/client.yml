name: Client CI

on:
  push:
    branches: [main]
    paths:
      [
        "web-react/**",
        "server/**",
        "shared/**",
        "scripts/smoke-web-agent-browser.sh",
        ".github/workflows/client.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "web-react/**",
        "server/**",
        "shared/**",
        "scripts/smoke-web-agent-browser.sh",
        ".github/workflows/client.yml",
      ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            web-react/package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run E2E Smoke Test
        run: |
          # Run the approved agent-browser smoke test
          ../scripts/smoke-web-agent-browser.sh
